name: Build Android APK

# Roda automaticamente a cada push na branch main, e também pode ser
# disparado manualmente pela aba "Actions" do GitHub (botão "Run workflow").
on:
  push:
    branches: [ main ]
    paths:
      - 'UltraVideoDownloader_Mobile/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Esta action instala o Buildozer, o Android SDK/NDK e faz cache
      # entre execuções (builds seguintes ficam bem mais rápidos).
      - name: Compilar APK com Buildozer
        id: buildozer
        uses: ArtemSBulgakov/buildozer-action@v1
        with:
          workdir: UltraVideoDownloader_Mobile
          command: buildozer android debug
          buildozer_version: stable

      - name: Disponibilizar o APK como artefato do build
        uses: actions/upload-artifact@v4
        with:
          name: UltraVideoDownloader-apk
          path: ${{ steps.buildozer.outputs.filename }}
          if-no-files-found: error
