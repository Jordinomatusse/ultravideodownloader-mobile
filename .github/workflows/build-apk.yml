name: Build Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'UltraVideoDownloader_Mobile/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk autoconf libtool pkg-config \
            zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev \
            automake build-essential ccache

      - name: Instalar Buildozer e Cython
        run: pip install --upgrade buildozer cython

      - name: Cache do Buildozer (acelera builds seguintes)
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            UltraVideoDownloader_Mobile/.buildozer
          key: buildozer-${{ hashFiles('UltraVideoDownloader_Mobile/buildozer.spec') }}
          restore-keys: buildozer-

      - name: Compilar APK com Buildozer
        working-directory: UltraVideoDownloader_Mobile
        run: yes | buildozer android debug

      - name: Disponibilizar o APK como artefato do build
        uses: actions/upload-artifact@v4
        with:
          name: UltraVideoDownloader-apk
          path: UltraVideoDownloader_Mobile/bin/*.apk
          if-no-files-found: error
